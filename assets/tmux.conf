# Prefix: Ctrl-Space, with Ctrl-b retained as a fallback.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Reload this file with prefix + q.
bind q source-file -F "#{config_files}" \; display-message "tmux config reloaded"

# Vi copy mode and system clipboard integration through the terminal.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Panes
bind x kill-pane
bind j select-pane -D
bind k select-pane -U
bind h select-pane -L
bind l select-pane -R
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Windows
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Sessions. Prefix+n prompts for a named session, matching the personal override.
unbind n
bind n command-prompt -p "Session name:" "new-session -s '%%'"
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General behavior
set -g default-shell "/usr/bin/zsh"
set -g default-command "/usr/bin/zsh -l"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
# Do not let a tmux server started by a color-suppressing process pass this
# variable to terminal applications such as Yazi.
set-environment -gu NO_COLOR
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 10
setw -g aggressive-resize on
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# Everforest theme matching Hyprland and Waybar.
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#2d353b,bg=#7fbbb3,bold] #S #[default] "
set -g status-right "#[fg=#83c092]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#[fg=#859289]#h "
set -g window-status-format "#[fg=#859289] #I:#W "
set -g window-status-current-format "#[fg=#7fbbb3,bold] #I:#W "
set -g pane-border-style "fg=#475258"
set -g pane-active-border-style "fg=#7fbbb3"
set -g message-style "bg=default,fg=#7fbbb3"
set -g message-command-style "bg=default,fg=#7fbbb3"
set -g mode-style "bg=#7fbbb3,fg=#2d353b"
setw -g clock-mode-colour "#7fbbb3"
