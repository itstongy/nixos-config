state_file = "auto"
engine = "whisper"

[hotkey]
enabled = false
key = "HOME"
mode = "push_to_talk"

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 300
pause_media = true

[whisper]
model = "large-v3-turbo"
language = "en"
translate = false
mode = "local"
flash_attention = false
on_demand_loading = true
gpu_isolation = false

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 1
wait_for_modifier_release = true
auto_submit = false
shift_enter_newlines = false
pre_type_delay_ms = 0

[output.notification]
on_recording_start = true
on_recording_stop = true
on_transcription = true
show_engine_icon = false

[osd]
enabled = false
frontend = "gtk4"
position = "bottom-center"
width_px = 800
height_px = 48
margin_px = 24
top_margin = 0.85
opacity = 0.8
waveform_window_secs = 5.0
peak_decay_db_per_sec = 8.0
waveform_gain = 4.0

[text]
spoken_punctuation = false
smart_auto_submit = false

[meeting]
enabled = false

[meeting.diarization]
enabled = false

[meeting.audio]
source = "mic"

[status]
icon_theme = "emoji"
